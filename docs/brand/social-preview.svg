<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- crewlead social preview. Re-render: bash docs/brand/render.sh -->
  <defs>
    <radialGradient id="glow" cx="18%" cy="20%" r="75%">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#3fb950"/>

  <!-- crew mark: one lead, three agents -->
  <g transform="translate(120 150)">
    <circle cx="40" cy="20" r="20" fill="#3fb950"/>
    <line x1="40" y1="40" x2="10" y2="86" stroke="#6e7681" stroke-width="4"/>
    <line x1="40" y1="40" x2="40" y2="86" stroke="#6e7681" stroke-width="4"/>
    <line x1="40" y1="40" x2="70" y2="86" stroke="#6e7681" stroke-width="4"/>
    <circle cx="10" cy="96" r="13" fill="#58a6ff"/>
    <circle cx="40" cy="96" r="13" fill="#58a6ff"/>
    <circle cx="70" cy="96" r="13" fill="#58a6ff"/>
  </g>

  <text x="230" y="238" class="sans" font-size="132" font-weight="800" fill="#f0f6fc" letter-spacing="-4">crewlead</text>
  <text x="120" y="335" class="sans" font-size="58" font-weight="600" fill="#c9d1d9">Lead a crew of AI agents</text>
  <text x="120" y="390" class="sans" font-size="30" fill="#8b949e">Issues in, draft PRs out, a person in charge. GitHub and GitLab.</text>

  <!-- flow line -->
  <g class="mono" font-size="26" font-weight="600" text-anchor="middle">
    <g fill="#161b22" stroke="#30363d" stroke-width="2">
      <rect x="120" y="462" width="118" height="58" rx="12"/>
      <rect x="276" y="462" width="110" height="58" rx="12"/>
      <rect x="424" y="462" width="96" height="58" rx="12" stroke="#3fb950"/>
      <rect x="558" y="462" width="166" height="58" rx="12"/>
      <rect x="762" y="462" width="132" height="58" rx="12"/>
      <rect x="932" y="462" width="228" height="58" rx="12" stroke="#3fb950"/>
    </g>
    <text x="179" y="500" fill="#c9d1d9">issue</text>
    <text x="331" y="500" fill="#c9d1d9">plan</text>
    <text x="472" y="500" fill="#3fb950">/go</text>
    <text x="641" y="500" fill="#c9d1d9">draft PR</text>
    <text x="828" y="500" fill="#c9d1d9">review</text>
    <text x="1046" y="500" fill="#3fb950">you merge</text>
    <g fill="#6e7681" font-size="24">
      <text x="257" y="499">→</text>
      <text x="405" y="499">→</text>
      <text x="539" y="499">→</text>
      <text x="743" y="499">→</text>
      <text x="913" y="499">→</text>
    </g>
  </g>

  <text x="1160" y="585" class="mono" font-size="22" fill="#6e7681" text-anchor="end">github.com/prinveee/crewlead</text>
</svg>
